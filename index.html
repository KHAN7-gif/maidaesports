<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<title>ESPORTS CHALLENGE HSWP 2026</title>

<style>
/* ================= BASE ================= */
body{
  font-family:Arial,Helvetica,sans-serif;
  background:#f2f2f2;
  margin:0;
  padding:16px;
}
h1{
  text-align:center;
  margin:0 0 14px;
  font-size:18px;
  font-weight:700;
  color:#222;
}

/* ================= LAYOUT ================= */
.container{
  display:grid;
  grid-template-columns:1.2fr 1fr;
  gap:16px;
}
.card{
  background:#efefef;
  border-radius:20px;
  padding:16px;
  box-shadow:0 6px 18px rgba(0,0,0,.12);
}
.card h3{
  margin:0 0 8px;
  font-size:15px;
}

/* ================= MAP HEADER ================= */
.map-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:8px;
  margin-bottom:6px;
}

/* ================= TABS ================= */
.tabs button{
  border:none;
  padding:6px 14px;
  border-radius:999px;
  background:#e2e2e2;
  font-size:12px;
  font-weight:600;
  cursor:pointer;
}
.tabs .active{background:#e0b65c}

/* ================= BUTTON ================= */
.btn{
  border:none;
  padding:6px 14px;
  border-radius:999px;
  font-size:12px;
  font-weight:700;
  color:#fff;
  cursor:pointer;
}
.btn-lock{background:#2ecc71}
.btn-unlock{background:#777}
.btn-reset{background:#e74c3c}
.btn-export{background:#3498db}
.btn-import{background:#9b59b6}

/* ================= TABLE ================= */
table{
  width:100%;
  border-collapse:collapse;
}
th,td{
  border-bottom:1px solid #d0d0d0;
  padding:8px;
  font-size:13px;
  text-align:center;
}
td.team{
  text-align:left;
  font-weight:600;
}

/* ================= DRAG ================= */
.drag-handle{
  cursor:grab;
  color:#666;
}
.drag-handle.disabled{
  cursor:not-allowed;
  opacity:.4;
}

/* ================= BADGE ================= */
.badge{
  display:inline-flex;
  padding:4px 12px;
  border-radius:999px;
  font-size:11px;
  font-weight:700;
}
.badge.wwcd{background:#e0b65c}
.badge.kill{background:#f0d88c}

/* ================= TREND ================= */
.trend-up{color:#27ae60;font-weight:800}
.trend-down{color:#e74c3c;font-weight:800}
.trend-stay{color:#3498db;font-weight:800}

/* ================= TOP 3 HIGHLIGHT ================= */
tr.rank-1{
  background:linear-gradient(90deg,#f6edb5 0%, #ffffff 70%);
}
tr.rank-2{
  background:linear-gradient(90deg,#ececec 0%, #ffffff 70%);
}
tr.rank-3{
  background:linear-gradient(90deg,#e9d1b8 0%, #ffffff 70%);
}

/* ================= POPUP ================= */
.popup{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.55);
  display:none;
  align-items:center;
  justify-content:center;
}
.popup-box{
  background:#fff;
  border-radius:18px;
  padding:16px;
  width:92%;
  max-width:340px;
}
.kill-grid{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:8px;
}
.kill-grid div{
  padding:14px 0;
  border-radius:10px;
  border:1px solid #ccc;
  text-align:center;
  cursor:pointer;
  font-weight:600;
}
.kill-grid .active{background:#e0b65c}

/* ================= MOBILE ================= */
@media(max-width:768px){
  .container{grid-template-columns:1fr}
  table thead{display:none}
  table tr{
    display:grid;
    grid-template-columns:36px 1fr 60px;
    padding:8px 0;
  }
  td{border:none}
  td.team{grid-column:2/4}
}
</style>
</head>

<body>

<h1>ESPORTS CHALLENGE HSWP 2026</h1>

<div class="container">

<!-- MAP STANDING -->
<div class="card">
<h3>MAP STANDING</h3>

<div class="map-header">
 <div class="tabs">
  <button id="tab-erangel" onclick="switchMap('erangel')">Erangel</button>
  <button id="tab-miramar" onclick="switchMap('miramar')">Miramar</button>
  <button id="tab-rondo" onclick="switchMap('rondo')">Rondo</button>
 </div>
 <div class="map-actions">
  <button id="lockBtn" class="btn btn-lock" onclick="toggleLock()">LOCK</button>
  <button class="btn btn-reset" onclick="resetMap()">RESET</button>
  <button class="btn btn-export" onclick="exportData()">EXPORT</button>
  <button class="btn btn-import" onclick="importData()">IMPORT</button>
  <input type="file" id="importFile" hidden>
 </div>
</div>

<table>
<thead>
<tr>
 <th>No</th><th>Team</th><th>WWCD</th><th>Place</th><th>Kill</th><th>Total</th>
</tr>
</thead>
<tbody id="mapTable"></tbody>
</table>
</div>

<!-- ALL STANDING -->
<div class="card">
<h3>ALL STANDING</h3>
<table>
<thead>
<tr>
 <th>No</th><th>Team</th><th>WWCD</th><th>Place</th><th>Kill</th><th>Total</th><th>Trend</th>
</tr>
</thead>
<tbody id="allTable"></tbody>
</table>
</div>

</div>

<script>
const teams=[
 "OL","Zentra","JURNEE 52","HEe ESPORT","AING BALANG","MANTARAY GIANT",
 "SolJar","Yelnats","Martabak Esport","THE RED X",
 "SANTAi KiLLERs","TOP PANDA","ROBOX","DND",
 "FAM | United","REDBULL 26 ESPORTS"
];
const maps=["erangel","miramar","rondo"];
const point=i=>[10,6,5,4,3,2,1,1][i]||0;

let state=JSON.parse(localStorage.getItem("hswp"))||{
 currentMap:"erangel",
 maps:{
  erangel:{locked:false,order:[...teams],kill:{}},
  miramar:{locked:false,order:[...teams],kill:{}},
  rondo:{locked:false,order:[...teams],kill:{}}
 }
};
maps.forEach(m=>teams.forEach(t=>state.maps[m].kill[t]??=0));
const save=()=>localStorage.setItem("hswp",JSON.stringify(state));

function switchMap(m){
 state.currentMap=m;
 document.querySelectorAll(".tabs button").forEach(b=>b.classList.remove("active"));
 document.getElementById("tab-"+m).classList.add("active");
 renderMap();
}
function toggleLock(){
 const m=state.maps[state.currentMap];
 m.locked=!m.locked;
 save(); renderMap();
}
function resetMap(){
 const m=state.maps[state.currentMap];
 if(m.locked) return alert("UNLOCK dahulu");
 m.order=[...teams];
 teams.forEach(t=>m.kill[t]=0);
 save(); renderMap();
}

let dragFrom=null;
function enableDrag(){
 const m=state.maps[state.currentMap];
 document.querySelectorAll("#mapTable tr").forEach((row,i)=>{
  row.draggable=!m.locked;
  row.addEventListener("dragstart",()=>{ if(!m.locked) dragFrom=i; });
  row.addEventListener("dragover",e=>{ if(!m.locked) e.preventDefault(); });
  row.addEventListener("drop",e=>{
   if(m.locked) return;
   e.preventDefault();
   const moved=m.order.splice(dragFrom,1)[0];
   m.order.splice(i,0,moved);
   save(); renderMap();
  });
 });
}

function renderMap(){
 const m=state.maps[state.currentMap];
 const lockBtn=document.getElementById("lockBtn");
 lockBtn.innerText=m.locked?"UNLOCK":"LOCK";
 lockBtn.className="btn "+(m.locked?"btn-unlock":"btn-lock");

 const tb=document.getElementById("mapTable");
 tb.innerHTML="";
 m.order.forEach((t,i)=>{
  const k=m.kill[t];
  tb.innerHTML+=`
   <tr>
    <td><span class="drag-handle ${m.locked?"disabled":""}">≡</span> ${i+1}</td>
    <td class="team">${t}</td>
    <td>${i===0?'<span class="badge wwcd">WWCD</span>':""}</td>
    <td>${point(i)}</td>
    <td>${k}</td>
    <td>${point(i)+k}</td>
   </tr>`;
 });
 enableDrag();
 renderAll();
}

function renderAll(){
 const agg={};
 teams.forEach(t=>agg[t]={w:0,p:0,k:0});

 const lockedMaps=Object.values(state.maps).filter(m=>m.locked);
 lockedMaps.forEach(m=>{
  m.order.forEach((t,i)=>{
   agg[t].p+=point(i);
   if(i===0) agg[t].w++;
   agg[t].k+=m.kill[t];
  });
 });

 let prevPos={},currPos={};
 if(lockedMaps.length>=2){
  const prev=lockedMaps[lockedMaps.length-2];
  const curr=lockedMaps[lockedMaps.length-1];
  prev.order.forEach((t,i)=>prevPos[t]=i);
  curr.order.forEach((t,i)=>currPos[t]=i);
 }

 const sorted=[...teams].sort((a,b)=>{
  const A=agg[a],B=agg[b];
  return (B.p+B.k)-(A.p+A.k)||B.w-A.w||B.p-A.p||B.k-A.k;
 });

 const tb=document.getElementById("allTable");
 tb.innerHTML="";
 sorted.forEach((t,i)=>{
  let trend=`<span class="trend-stay">–</span>`;
  if(currPos[t]!==undefined){
   if(currPos[t]<prevPos[t]) trend=`<span class="trend-up">▲</span>`;
   else if(currPos[t]>prevPos[t]) trend=`<span class="trend-down">▼</span>`;
  }
  const rankClass=i===0?'rank-1':i===1?'rank-2':i===2?'rank-3':'';
  tb.innerHTML+=`
   <tr class="${rankClass}">
    <td>${i+1}</td>
    <td class="team">${t}</td>
    <td>${agg[t].w}</td>
    <td>${agg[t].p}</td>
    <td>${agg[t].k}</td>
    <td><strong>${agg[t].p+agg[t].k}</strong></td>
    <td>${trend}</td>
   </tr>`;
 });
}

switchMap(state.currentMap);
</script>

</body>
</html>
