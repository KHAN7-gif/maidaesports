<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1920">
<title>WWCD OBS — MAIDA ESPORTS</title>
<script src="../firebase_sync.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;800;900&family=Barlow+Condensed:wght@700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{
  width:1920px;height:1080px;overflow:hidden;
  background:transparent;
  font-family:'Barlow Condensed',sans-serif;
}

/* POSTER BACKGROUND */
#posterBg{
  position:absolute;inset:0;z-index:0;
  background:#07050f;
  transition:background .5s;
}
#posterBg img{width:100%;height:100%;object-fit:cover;display:block}

/* WWCD OVERLAY — shows when team selected */
#wwcdOverlay{
  position:absolute;inset:0;z-index:2;
  display:flex;flex-direction:row;align-items:center;justify-content:center;
  gap:80px;padding:0 120px;
  opacity:0;transform:scale(.9);
  transition:opacity .5s cubic-bezier(.34,1.56,.64,1), transform .5s cubic-bezier(.34,1.56,.64,1);
}
#wwcdOverlay.show{opacity:1;transform:scale(1)}

/* Glow backdrop behind WWCD card */
.wwcd-glow{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  width:900px;height:700px;z-index:1;
  background:radial-gradient(ellipse,rgba(255,215,0,.35) 0%,transparent 65%);
  animation:glowPulse 2s ease-in-out infinite;
}
@keyframes glowPulse{0%,100%{opacity:.7}50%{opacity:1}}

/* WWCD CARD */
.wwcd-card{
  position:relative;z-index:2;
  display:flex;flex-direction:row;align-items:center;gap:60px;
  animation:cardEntrance .6s cubic-bezier(.34,1.56,.64,1);
}
@keyframes cardEntrance{
  0%{transform:translateY(80px) scale(.85);opacity:0}
  100%{transform:translateY(0) scale(1);opacity:1}
}

/* Crown */
.wwcd-crown{font-size:100px;line-height:1;
  animation:crownBob 2s ease-in-out infinite;
  filter:drop-shadow(0 0 30px rgba(255,215,0,.8));
}
@keyframes crownBob{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-12px) rotate(3deg)}}

/* Team logo */
.wwcd-logo{
  width:320px;height:320px;border-radius:40px;
  object-fit:cover;border:6px solid #ffd700;
  box-shadow:0 0 60px rgba(255,215,0,.5),0 0 120px rgba(255,215,0,.2);
  background:rgba(255,255,255,.05);
  display:flex;align-items:center;justify-content:center;
}
.wwcd-logo img{width:100%;height:100%;border-radius:34px;object-fit:cover;width:100%;height:100%}
.wwcd-logo-placeholder{
  font-family:'Orbitron',sans-serif;font-weight:900;font-size:80px;
  color:#ffd700;
}

/* Text */
.wwcd-label-top{
  font-family:'Share Tech Mono',sans-serif;font-size:32px;
  letter-spacing:.4em;color:rgba(255,215,0,.7);text-transform:uppercase;
}
.wwcd-teamname{
  font-family:'Orbitron',sans-serif;font-weight:900;
  font-size:clamp(50px,6vw,80px);letter-spacing:.04em;
  text-transform:uppercase;text-align:center;
  background:linear-gradient(135deg,#fff 0%,#ffd700 50%,#ffb300 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  text-shadow:none;
  line-height:1;
  filter:drop-shadow(0 4px 24px rgba(255,215,0,.4));
}
.wwcd-fullname{
  font-size:32px;font-weight:700;color:rgba(255,255,255,.7);
  letter-spacing:.1em;text-transform:uppercase;text-align:center;
  max-width:900px;
}
.wwcd-text-col{display:flex;flex-direction:column;gap:20px;align-items:flex-start}
.wwcd-banner-text{
  font-family:'Orbitron',sans-serif;font-weight:900;font-size:40px;
  letter-spacing:.18em;
  background:linear-gradient(90deg,rgba(255,215,0,0),#ffd700 30%,#ffd700 70%,rgba(255,215,0,0));
  -webkit-background-clip:text;background-clip:text;color:transparent;
  text-transform:uppercase;padding:0;
  animation:bannerGlow 1.5s ease-in-out infinite;
}
@keyframes bannerGlow{0%,100%{filter:brightness(1)}50%{filter:brightness(1.3)}}

/* EMPTY STATE (no team selected) */
#emptyState{
  position:absolute;inset:0;z-index:2;
  display:flex;align-items:center;justify-content:center;
  flex-direction:column;gap:16px;
}
#emptyState.hide{display:none}
.es-text{font-family:'Share Tech Mono',sans-serif;font-size:24px;
  letter-spacing:.25em;color:rgba(255,255,255,.2);text-transform:uppercase}
</style>
</head>
<body>

<!-- POSTER BACKGROUND -->
<div id="posterBg">
  <img id="posterImg" src="" alt="" onerror="this.style.display='none'" style="display:none">
</div>

<!-- EMPTY STATE -->
<div id="emptyState">
  <div class="es-text">🏆 Menunggu WWCD</div>
  <div class="es-text" style="font-size:16px">Pilih team di WWCD Tracker</div>
</div>

<!-- WWCD OVERLAY -->
<div id="wwcdOverlay">
  <div class="wwcd-glow"></div>
  <div class="wwcd-card">
    <div style="display:flex;flex-direction:column;align-items:center;gap:16px">
      <div class="wwcd-crown">👑</div>
      <div class="wwcd-logo" id="obsLogo">
      <div class="wwcd-logo-placeholder" id="obsLogoPlaceholder">?</div>
    </div>
    <div class="wwcd-text-col">
      <div class="wwcd-label-top">Winner Winner</div>
      <div class="wwcd-teamname" id="obsTeamName">TEAM</div>
      <div class="wwcd-fullname" id="obsFullName"></div>
      <div class="wwcd-banner-text">Chicken Dinner</div>
    </div>
  </div>
</div>

<script>
function convertGDrive(url){
  if(!url) return url;
  var m=url.match(/drive\.google\.com\/file\/d\/([a-zA-Z0-9_-]+)/);
  if(m) return 'https://lh3.googleusercontent.com/d/'+m[1];
  var m2=url.match(/drive\.google\.com\/open\?id=([a-zA-Z0-9_-]+)/);
  if(m2) return 'https://lh3.googleusercontent.com/d/'+m2[1];
  return url;
}

var currentName = null;

function applyWWCD(w){
  var overlay = document.getElementById('wwcdOverlay');
  var emptyState = document.getElementById('emptyState');

  if(!w || !w.name){
    overlay.classList.remove('show');
    emptyState.classList.remove('hide');
    currentName = null;
    return;
  }

  // Same team — no need to re-animate
  if(currentName === w.name) return;
  currentName = w.name;

  emptyState.classList.add('hide');

  // Team logo
  var obsLogo = document.getElementById('obsLogo');
  var logoUrl = w.logo ? convertGDrive(w.logo) : '';
  if(logoUrl){
    obsLogo.innerHTML = '<img src="'+logoUrl+'" onerror="this.style.display=\'none\'">';
  } else {
    obsLogo.innerHTML = '<div class="wwcd-logo-placeholder">'+(w.name?w.name[0]:'?')+'</div>';
  }

  document.getElementById('obsTeamName').textContent = w.name || '';
  document.getElementById('obsFullName').textContent = w.fullName || '';

  // Poster
  if(w.poster){
    var pUrl = convertGDrive(w.poster);
    var pImg = document.getElementById('posterImg');
    pImg.src = pUrl;
    pImg.style.display = 'block';
  }

  // Trigger entrance animation
  overlay.classList.remove('show');
  void overlay.offsetWidth; // reflow
  setTimeout(function(){ overlay.classList.add('show'); }, 50);
}

// Listen Firebase
if(typeof fsListen === 'function'){
  fsListen('maida/wwcd', applyWWCD, 1);
} else if(typeof fsGet === 'function'){
  fsGet('maida/wwcd', applyWWCD);
  setInterval(function(){ fsGet('maida/wwcd', applyWWCD); }, 1000);
}
</script>
</body>
</html>
