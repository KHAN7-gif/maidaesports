<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log Masuk — MAIDA ESPORTS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --pink:#ec0b6e; --pink2:#ff2d86; --pink-soft:#ffd9ea; --pink-tint:#fff2f7;
  --ink:#12131a; --ink2:#3a3f52; --muted:#7a8091; --faint:#aab0c0;
  --line:#e9ebf1; --line2:#e0e3ea;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',-apple-system,system-ui,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;
  min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px 18px;position:relative;overflow:hidden;
  background:linear-gradient(135deg,#ffffff 0%,#fdf0f6 55%,#ffeaf3 100%);}
/* decorative bg */
.bgshape{position:absolute;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.bgshape .diag{position:absolute;width:140%;height:70%;left:-20%;top:-30%;transform:rotate(-12deg);
  background:linear-gradient(180deg,rgba(255,255,255,.7),transparent);}
.bgshape .diag2{position:absolute;width:120%;height:60%;right:-30%;bottom:-25%;transform:rotate(-10deg);
  background:linear-gradient(0deg,rgba(255,255,255,.55),transparent);}
.dots{position:absolute;top:34%;width:150px;height:220px;opacity:.5;
  background-image:radial-gradient(var(--pink-soft) 1.6px,transparent 1.6px);background-size:15px 15px}
.dots.l{left:3%} .dots.r{right:3%}
button{font-family:inherit;cursor:pointer;border:none;background:none}
a{color:inherit;text-decoration:none}
::selection{background:var(--pink);color:#fff}

.stage{position:relative;z-index:1;width:100%;max-width:520px;display:flex;flex-direction:column;align-items:center}

/* brand */
.brand{display:flex;align-items:center;gap:20px;margin-bottom:6px}
.brand .line{width:52px;height:2px;background:linear-gradient(90deg,transparent,var(--pink));position:relative}
.brand .line.r{background:linear-gradient(90deg,var(--pink),transparent)}
.brand .line::after{content:"";position:absolute;top:-3px;right:-1px;width:8px;height:8px;border-radius:50%;background:var(--pink)}
.brand .line.r::after{right:auto;left:-1px}
.brand h1{font-family:'Archivo',sans-serif;font-weight:900;font-size:clamp(30px,6vw,46px);letter-spacing:-.01em;text-transform:uppercase;font-style:italic}
.brand h1 b{color:var(--pink)}
.brand-sub{font-size:12px;font-weight:700;letter-spacing:.32em;text-transform:uppercase;color:var(--faint);margin-bottom:26px}

/* card */
.card{background:#fff;border:1px solid var(--line);border-radius:26px;width:100%;padding:44px 40px 38px;position:relative;
  box-shadow:0 2px 8px rgba(18,19,26,.05),0 30px 70px rgba(236,11,110,.10);}
.helmet{width:74px;height:74px;border-radius:50%;background:#fff;border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;color:var(--pink);position:absolute;top:-37px;left:50%;transform:translateX(-50%);
  box-shadow:0 8px 20px rgba(236,11,110,.14)}
.card h2{font-family:'Archivo',sans-serif;font-size:26px;font-weight:800;text-align:center;margin-top:18px}
.card .cs{text-align:center;color:var(--muted);font-size:13.5px;margin-top:5px;margin-bottom:26px}

.lbl{display:block;font-size:11.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--ink2);margin:0 0 8px}
.inp{display:flex;align-items:center;gap:11px;border:1px solid var(--line);border-radius:14px;padding:14px 15px;background:#fafbfd;transition:.15s;margin-bottom:18px}
.inp:focus-within{border-color:var(--pink);background:#fff;box-shadow:0 0 0 3px var(--pink-tint)}
.inp svg{color:var(--faint);flex-shrink:0}
.inp input{border:none;outline:none;background:none;font-size:14.5px;width:100%;font-family:inherit;color:var(--ink)}
.inp .eye{color:var(--faint);display:flex;transition:.15s}
.inp .eye:hover{color:var(--pink)}

.row{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;flex-wrap:wrap;gap:10px}
.check{display:flex;align-items:center;gap:9px;font-size:13.5px;color:var(--ink2);cursor:pointer;user-select:none}
.check input{display:none}
.check .box{width:19px;height:19px;border:2px solid var(--line2);border-radius:6px;display:flex;align-items:center;justify-content:center;transition:.15s;color:#fff}
.check input:checked + .box{background:var(--pink);border-color:var(--pink)}
.check input:checked + .box svg{opacity:1}
.check .box svg{opacity:0;transition:.15s}
.forgot{font-size:13.5px;font-weight:700;color:var(--pink)}
.forgot:hover{text-decoration:underline}

.submit{width:100%;background:linear-gradient(135deg,var(--pink),var(--pink2));color:#fff;font-family:'Archivo',sans-serif;
  font-weight:800;font-size:15px;letter-spacing:.08em;text-transform:uppercase;padding:16px;border-radius:15px;
  display:flex;align-items:center;justify-content:center;gap:10px;transition:.15s;box-shadow:0 10px 26px rgba(236,11,110,.35)}
.submit:hover{transform:translateY(-1px);box-shadow:0 14px 32px rgba(236,11,110,.45)}
.submit:active{transform:translateY(0)}
.hint{text-align:center;font-size:11.5px;color:var(--faint);margin-top:14px}

.foot{position:relative;z-index:1;margin-top:28px;font-size:12.5px;color:var(--muted)}
.foot b{color:var(--pink);font-weight:700}
.err{color:var(--pink);font-size:12.5px;font-weight:600;text-align:center;min-height:16px;margin-bottom:6px}

@media(max-width:480px){ .card{padding:40px 24px 30px} .brand .line{width:32px} }
</style>
</head>
<body>
<div class="bgshape"><div class="diag"></div><div class="diag2"></div><div class="dots l"></div><div class="dots r"></div></div>

<div class="stage">
  <div class="brand">
    <span class="line"></span>
    <h1>MAIDA <b>ESPORTS</b></h1>
    <span class="line r"></span>
  </div>
  <div class="brand-sub">PUBG Mobile Tournament System</div>

  <form class="card" onsubmit="return doLogin(event)">
    <div class="helmet">
      <svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3.5 13a8.5 8.5 0 0117 0v2.2a1.8 1.8 0 01-1.8 1.8H12"/>
        <path d="M3.5 13.2c2.3.7 5 .9 8 .9 1.6 0 3-.1 4.3-.3"/>
        <circle cx="8.5" cy="12" r="2.1"/>
        <path d="M3.6 16.2l3.1 2.6a3 3 0 002 .7H12v-3"/>
      </svg>
    </div>
    <h2>Log Masuk</h2>
    <div class="cs">Sila log masuk untuk meneruskan</div>

    <div class="err" id="err"></div>

    <label class="lbl">Username</label>
    <div class="inp">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 4-6 8-6s8 2 8 6"/></svg>
      <input id="user" placeholder="Masukkan username" autocomplete="username">
    </div>

    <label class="lbl">Password</label>
    <div class="inp">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><rect x="4" y="11" width="16" height="9" rx="2"/><path d="M8 11V8a4 4 0 018 0v3"/></svg>
      <input id="pass" type="password" placeholder="Masukkan password" autocomplete="current-password">
      <button type="button" class="eye" onclick="togglePw(this)" title="Papar/sembunyi">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>
      </button>
    </div>

    <div class="row">
      <label class="check"><input type="checkbox" id="remember"><span class="box"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L20 6"/></svg></span>Ingat saya</label>
      <a class="forgot" href="#" onclick="forgot();return false">Lupa password?</a>
    </div>

    <button type="submit" class="submit">Log Masuk
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
    </button>
    <div class="hint">Demo: masukkan sebarang username &amp; password untuk masuk.</div>
  </form>
</div>

<div class="foot">© 2026 <b>MAIDA ESPORTS</b>. Semua hak cipta terpelihara.</div>

<script>
// Nota: ini gate kosmetik untuk paparan (bukan keselamatan sebenar di hosting statik).
(function(){ var u=localStorage.getItem('maida_login_user'); if(u){ document.getElementById('user').value=u; document.getElementById('remember').checked=true; } })();
function togglePw(btn){ var p=document.getElementById('pass'); p.type = p.type==='password' ? 'text':'password'; btn.style.color = p.type==='text' ? 'var(--pink)':''; }
function forgot(){ document.getElementById('err').textContent='Sila hubungi admin untuk reset password.'; }
function doLogin(e){
  e.preventDefault();
  var u=document.getElementById('user').value.trim();
  var p=document.getElementById('pass').value;
  var err=document.getElementById('err');
  if(!u || !p){ err.textContent='Sila isi username & password.'; return false; }
  try{
    localStorage.setItem('maida_auth','1');
    if(document.getElementById('remember').checked) localStorage.setItem('maida_login_user',u);
    else localStorage.removeItem('maida_login_user');
  }catch(err2){}
  window.location.href='index.html';
  return false;
}
</script>
</body>
</html>
